name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a candidate, built with the feature
  # that lets a plugin claim `api` and `srp`. Raise it when a newer candidate is out.
  HOST_TAG: v0.5.0-rc.1

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
      - name: File size budget
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"
      - run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ~/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}-dev-unreserve
      - name: Install the host
        if: steps.host.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --features dev-unreserve --root ~/bddkit-host bddkit

      # The suites start their own stub on a random port and run against the
      # real host binary.
      - name: Tests
        run: |
          export BDDKIT_BIN="$HOME/bddkit-host/bin/bddkit"
          cargo test --locked

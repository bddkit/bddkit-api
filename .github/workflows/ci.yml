name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The host the plugin is tested against: a candidate. Raise it when a newer one is out.
  HOST_TAG: v0.5.0-rc.3

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest
    services:
      # The mocks of examples/ are loaded by the Examples step: a service
      # container cannot mount a file of the checkout.
      smocker:
        image: ghcr.io/smocker-dev/smocker:v1.1.2-preview
        ports:
          - 8080:8080
          - 8081:8081
    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
      - name: File size budget
        run: |
          files=$(git ls-files '*.rs' '*.feature' '*.yaml' '*.yml' ':!.github/')
          status=0
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 1000 ]; then
              echo "::error file=$file::$lines lines, the limit is 1000"
              status=1
            fi
          done <<< "$files"
          exit "$status"
      - run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cache the host
        id: host
        uses: actions/cache@v4
        with:
          path: ~/bddkit-host
          key: bddkit-host-${{ env.HOST_TAG }}
      - name: Install the host
        if: steps.host.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/bddkit/bddkit --tag "$HOST_TAG"
          --locked --root ~/bddkit-host bddkit

      # The suites start their own stub on a random port and run against the
      # real host binary.
      - name: Tests
        run: |
          export BDDKIT_BIN="$HOME/bddkit-host/bin/bddkit"
          cargo test --locked

      # The examples are the demonstration surface: without this they rot.
      - name: Examples
        run: |
          export BDDKIT_BIN="$HOME/bddkit-host/bin/bddkit"
          cargo build --locked
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8081/version && break; sleep 1; done
          curl -fsS -X POST -H 'Content-Type: application/x-yaml' \
            --data-binary @examples/mocks/api-server.yaml http://127.0.0.1:8081/mocks
          lock="$RUNNER_TEMP/lock"
          mkdir -p "$lock"
          printf 'plugin:\n  - name: api\n    path: %s/target/debug/libbddkit_api.so\n' "$PWD" > "$lock/plugins.yaml"
          "$BDDKIT_BIN" run --config examples/api.yaml --bddkit-dir "$lock"

  # The unit tests on the five release targets; the subprocess tests need the
  # host and run on Linux above.
  units:
    name: unit tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          target: ${{ matrix.target }}
          rustflags: ""
      - run: cargo test --locked --lib --target ${{ matrix.target }}

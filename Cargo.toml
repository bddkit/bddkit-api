# Its own workspace root on purpose: without this, a parent workspace builds
# the plugin implicitly and `cargo clippy --all-targets` in the parent sees it.
[workspace]

[package]
name = "bddkit-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "HTTP API and SRP steps for the bddkit acceptance-testing tool"
license = "Apache-2.0"
repository = "https://github.com/bddkit/bddkit-api"
homepage = "https://github.com/bddkit/bddkit-api"
readme = "README.md"
keywords = ["bdd", "gherkin", "testing", "http", "bddkit"]
categories = ["development-tools::testing"]
exclude = ["/.github", "/.idea", "/docs"]

[lib]
# rlib beside the cdylib so `tests/` can call the exports in-process.
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
bddkit-crate-json = "0.1"
getrandom = "0.3"
hmac = "0.12"
mime_guess = "2"
num-bigint = "0.4"
regex = "1.13"
reqwest = { version = "0.13", features = ["form", "multipart"] }
scraper = "0.27.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
tokio = { version = "1.53", features = ["rt-multi-thread"] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
clone_on_ref_ptr = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# noise for this project
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
format_push_string = "allow"
